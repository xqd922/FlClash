[package]
name = "helper"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "helper"
path = "src/main.rs"

[dependencies]
windows-service = { version = "0.7.0", optional = true }
# NOTE: 只启用需要的 tokio features，减少二进制体积。
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1.0.93"
warp = "0.3.7"
serde = { version = "1.0.215", features = ["derive"] }
sha2 = "0.10.8"


[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
